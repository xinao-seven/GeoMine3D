# 后端 CI 门禁:ruff(lint) + pytest(含覆盖率下限)。
#
# 与本地 scripts/ci_check.ps1 跑一模一样的命令:CI 挂了能在本机原样复现,反之亦然。
# 为什么要 service 容器:app/main.py 的 lifespan 会访问 MySQL(fail_stale_modeling_jobs),
# test_health 走 TestClient 触发 lifespan,所以没有 MySQL 时测试必挂。
name: backend-ci

on:
  push:
    branches: ["feature/**", "main"]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: geomine3d
          MYSQL_USER: geomine
          MYSQL_PASSWORD: geomine
          MYSQL_ROOT_PASSWORD: geomine-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ugeomine -pgeomine"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20

    env:
      DATABASE_URL: mysql+asyncmy://geomine:geomine@127.0.0.1:3306/geomine3d?charset=utf8mb4
      REDIS_ENABLED: "true"
      REDIS_URL: redis://127.0.0.1:6379/0
      APP_ENV: ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Alembic migrations
        run: python -m alembic upgrade head

      - name: Ruff lint
        run: python -m ruff check app tests

      - name: Pytest + coverage gate
        run: python -m pytest tests -q --cov=app --cov-report=term --cov-fail-under=60

      # mypy 只做信息收集:现有 SQLAlchemy Mapped 代码没有注解,设成门禁会变成
      # 一场与本次改造无关的大规模补注解工程,不阻塞 CI。
      - name: Mypy (informational)
        continue-on-error: true
        run: |
          pip install mypy==1.13.0
          python -m mypy app --ignore-missing-imports --no-error-summary || true
