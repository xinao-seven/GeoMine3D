services:
  mysql:
    image: mysql:8.0
    container_name: geomine3d-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: geomine3d
      MYSQL_USER: geomine
      MYSQL_PASSWORD: geomine
      MYSQL_ROOT_PASSWORD: geomine-root
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - geomine3d_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ugeomine", "-pgeomine"]
      interval: 5s
      timeout: 5s
      retries: 20

  # 单容器 Redis:建模任务队列 / 进度推送 / 分析结果缓存共用同一个实例。
  # 对外只暴露本机 6379,数据用 appendonly 落盘(named volume),重启不丢未 ACK 的任务。
  # 启动: docker compose up -d   (同时起 mysql + redis)
  redis:
    image: redis:7-alpine
    container_name: geomine3d-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - "900 1"
    ports:
      - "6379:6379"
    volumes:
      - geomine3d_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  geomine3d_mysql_data:
  geomine3d_redis_data:
